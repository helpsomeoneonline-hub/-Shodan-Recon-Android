name: Android emulator smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-smoke.yml'
      - 'smoke/**'
permissions:
  contents: read
  actions: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APK_BUILD_RUN: '38141506505'
      APK_BUILD_SHA: '9098d4c480b7961947b3663e7c35604c40fa8f0a'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify exact APK build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$APK_BUILD_RUN" > /tmp/apk-build-run.json
          python3 -c 'import json,os; r=json.load(open("/tmp/apk-build-run.json")); assert r["head_sha"]==os.environ["APK_BUILD_SHA"] and r["conclusion"]=="success", "The required APK build has not succeeded"'
      - uses: actions/download-artifact@v4
        with:
          name: ShodanRecon-debug-apk
          path: smoke-apk
          github-token: ${{ github.token }}
          run-id: ${{ env.APK_BUILD_RUN }}
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch and rotate the built APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash smoke/run.sh
      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ShodanRecon-emulator-smoke
          path: smoke-results/
          if-no-files-found: warn
          retention-days: 30
