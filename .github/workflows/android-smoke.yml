name: Android emulator smoke
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful Build Android APK run ID
        required: true
      build_sha:
        description: Exact application commit SHA from that run
        required: true
  workflow_run:
    workflows: [Build Android APK]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APK_BUILD_RUN: ${{ github.event.workflow_run.id || inputs.build_run }}
      APK_BUILD_SHA: ${{ github.event.workflow_run.head_sha || inputs.build_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APK_BUILD_SHA }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify exact APK build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$APK_BUILD_RUN" > /tmp/apk-build-run.json
          python3 -c 'import json,os; r=json.load(open("/tmp/apk-build-run.json")); assert r["head_sha"]==os.environ["APK_BUILD_SHA"] and r["conclusion"]=="success", "The required APK build has not succeeded"'
      - uses: actions/download-artifact@v4
        with:
          name: ShodanRecon-debug-apk
          path: smoke-apk
          github-token: ${{ github.token }}
          run-id: ${{ env.APK_BUILD_RUN }}
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch and rotate the built APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash smoke/run.sh
      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ShodanRecon-emulator-smoke
          path: smoke-results/
          if-no-files-found: warn
          retention-days: 30
